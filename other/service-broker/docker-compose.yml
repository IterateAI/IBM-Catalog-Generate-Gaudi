services:
  broker:
    build: .
    container_name: service_broker
    env_file:
      - .env
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

  db:
    image: postgres:16
    container_name: service-broker-db
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:8
    container_name: service-broker-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data  # Persist Redis data
    restart: unless-stopped

  # Celery worker with Terraform support
  celery:
    build:
      context: .
      dockerfile: Dockerfile.terraform
    container_name: celery_worker
    env_file:
      - .env
    environment:
      TERRAFORM_DIR: /terraform
    volumes:
      - terraform_data:/terraform/workspace  # Persist Terraform state
      - ./keys/id_rsa:/app/keys/id_rsa       # Change path as needed
      # - ./terraform:/terraform/base:ro     # Optional, if using base Terraform files
    depends_on:
      - redis
      - db
    restart: unless-stopped

  # Usage reporting service with separate Celery instance
  usage-service:
    build:
      context: .
      dockerfile: Dockerfile.usage
    container_name: usage_service
    env_file: .env
    # environment:
    #   REDIS_URL: redis://redis:6379/1  # Different Redis DB for usage service
    #   POSTGRES_HOST: db
    #   POSTGRES_PORT: 5432
    volumes:
      - usage_data:/app/data  # Persist beat schedule
    depends_on:
      - redis
      - db
    restart: unless-stopped

volumes:
  pgdata:
  terraform_data:
  redis_data:
  usage_data:
